<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="playing-cards">
    <!-- Carta 1: Ás de Espadas -->
    <div class="card spades">
      <div class="left">
        <span>A</span>
        <span>♠</span>
      </div>
      <div class="middle">
        <span>♠</span>
      </div>
      <div class="right">
        <span>A</span>
        <span>♠</span>
      </div>
    </div>

    <!-- Carta 2: Rei de Copas -->
    <div class="card hearts">
      <div class="left">
        <span>K</span>
        <span>♥</span>
      </div>
      <div class="middle">
        <span>♥</span>
      </div>
      <div class="right">
        <span>K</span>
        <span>♥</span>
      </div>
    </div>

    <!-- Carta 3: Sete de Ouros -->
    <div class="card diamonds">
      <div class="left">
        <span>7</span>
        <span>♦</span>
      </div>
      <div class="middle">
        <span>♦</span>
      </div>
      <div class="right">
        <span>7</span>
        <span>♦</span>
      </div>
    </div>
  </main>
</body>
</html>
