<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="todo-container">
        <h1>Minha Lista de Tarefas</h1>
        <ul class="todo-list">
            <li>
                <input type="checkbox" id="task-1">
                <label for="task-1">Estudar Fundamentos de CSS</label>
                <ul class="sub-item">
                    <li>
                        <a href="https://www.freecodecamp.org" target="_blank" class="sub-item-link">Acessar documentação do freeCodeCamp</a>
                    </li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="task-2">
                <label for="task-2">Construir o Menu de Café</label>
                <ul class="sub-item">
                    <li>
                        <a href="https://developer.mozilla.org" target="_blank" class="sub-item-link">Ver referências no MDN Web Docs</a>
                    </li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="task-3">
                <label for="task-3">Revisar Especificidade e Cascata</label>
                <ul class="sub-item">
                    <li>
                        <a href="https://www.w3.org" target="_blank" class="sub-item-link">Consultar especificações do W3C</a>
                    </li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="task-4">
                <label for="task-4">Praticar Estados de Links e Listas</label>
                <ul class="sub-item">
                    <li>
                        <a href="https://web.dev" target="_blank" class="sub-item-link">Ler guias de boas práticas na web.dev</a>
                    </li>
                </ul>
            </li>
        </ul>
    </main>
</body>

</html>
