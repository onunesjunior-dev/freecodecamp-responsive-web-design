<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="blog-post-card">
        <img class="post-img" src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" alt="A laptop on a desk with code on the screen">
        <div class="post-content">
            <h2 class="post-title">Dominando CSS Básico e Responsivo</h2>
            <p class="post-excerpt">Aprenda como estilizar elementos com imagens de fundo, gradientes, bordas modernas e efeitos de transição acessíveis.</p>
            <a href="#" class="read-more">Read More</a>
        </div>
    </div>
</body>
</html>
